<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5S 稽核管理系統｜互動驗證版</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Fira+Sans:wght@300;400;500;600;700&display=swap');
    :root{
      --bg: #F8FAFC; --card: #FFFFFF; --text: #0F172A; --muted: #64748B; --border: #E2E8F0;
      --blue: #2563EB; --blue2: #1D4ED8; --blue3: #EFF6FF; --nav: #FFFFFF;
      --red: #DC2626; --orange: #D97706; --green: #059669; --purple: #7C3AED; --gray: #94A3B8;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); --radius: 8px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:'Fira Sans',"Microsoft JhengHei","Noto Sans TC","PingFang TC",Arial,sans-serif;background:var(--bg);color:var(--text)}
    button,select,input,textarea{font-family:inherit}
    .app{display:grid;grid-template-columns:250px 1fr;grid-template-rows:64px 1fr;min-height:100vh}
    .topbar{grid-column:2/3;background:#FFFFFF;color:var(--text);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
    .sidebar{grid-row:1/3;grid-column:1/2;background:var(--nav);color:var(--text);position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--border)}
    .brand{display:flex;align-items:center;gap:14px;padding:0 20px;height:64px;font-weight:700;font-size:18px;letter-spacing:0.5px;color:var(--text);border-bottom:1px solid var(--border);margin-bottom:8px}
    .gridIcon{width:22px;height:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--blue);padding:3px;border-radius:4px;}
    .gridIcon span{background:#fff;border-radius:1px;}
    .topMain{display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:16px;width:100%}
    .topBreadcrumbs{font-weight:500;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px;}
    .cycleBox{display:flex;align-items:center;gap:10px;padding:8px 14px;border:1px solid var(--border);border-radius:6px;background:var(--bg);font-weight:600;font-family:'Fira Code', monospace;color:var(--text)}
    .topTools{display:flex;align-items:center;gap:12px}
    .roleSelect,.timeInput{height:36px;border:1px solid var(--border);background:#fff;color:var(--text);border-radius:6px;padding:0 10px;font-weight:600}
    .roleSelect option{color:#111;background:#fff}
    .userBox{display:flex;align-items:center;gap:10px;border-left:1px solid var(--border);padding-left:16px;margin-left:4px}
    .avatar{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700}
    .sideTitle{color:var(--muted);font-size:12px;padding:16px 22px 8px;font-weight:700;}
    .navGroup{margin-bottom:2px}
    .navBtn{width:calc(100% - 24px);margin:0 12px;height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;border:0;background:transparent;color:#475569;text-align:left;font-size:14px;font-weight:600;cursor:pointer;border-radius:6px;transition:all 0.15s ease;}
    .navBtn:hover{background:var(--bg);color:var(--text)}
    .navBtn.active{background:var(--blue);color:#fff}
    .navBtn.sub{padding-left:42px;font-weight:500;}
    .sub-menu{display:none; flex-direction:column; margin-bottom:4px;}
    .sub-menu.open{display:flex;}
    .folder-btn{justify-content:space-between;font-weight:700;color:var(--text);}
    .main{padding:18px 20px;overflow:auto;min-width:1080px}
    .pageTitle{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:16px}
    .pageTitle h1{margin:0;font-size:24px;font-weight:700;}
    .hint{color:var(--muted);font-size:13px;line-height:1.6;margin-top:4px}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
    .panelHeader{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);gap:12px}
    .panelTitle{font-weight:700;font-size:16px}
    .panelBody{padding:16px 18px}
    .btn{border:0;border-radius:6px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;transition:all 0.15s ease-in-out;white-space:nowrap}
    .btn:hover{transform:translateY(-1px);box-shadow:0 4px 6px rgba(0,0,0,0.1);filter:brightness(.98)}
    .btnPrimary{background:var(--blue);color:#fff}
    .btnLight{background:#F1F5F9;color:#334155;border:1px solid #E2E8F0}
    .btnDanger{background:#FEF2F2;color:#DC2626;border:1px solid #FECACA}
    .btnWarn{background:#FFFBEB;color:#D97706;border:1px solid #FDE68A}
    .btnGreen{background:#ECFDF5;color:#059669;border:1px solid #A7F3D0}
    .btnPurple{background:#F5F3FF;color:#7C3AED;border:1px solid #DDD6FE}
    .btnTiny{padding:6px 9px;font-size:12px}
    .kpiGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:16px}
    .kpi{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);text-align:center;padding:18px 10px;cursor:pointer;transition:all 0.2s;}
    .kpi:hover{outline:2px solid var(--blue);transform:translateY(-2px);}
    .kpi .label{font-weight:600;color:var(--muted);font-size:13px}
    .kpi .num{font-size:36px;margin:8px 0 5px;line-height:1;font-weight:700;font-family:'Fira Code', monospace;}
    .kpi small{font-size:14px;color:var(--text);margin-left:4px;font-weight:500;}
    .kpi .sub{font-size:12px;color:var(--muted)}
    .grid2{display:grid;grid-template-columns:1.55fr .95fr;gap:16px}
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .formGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
    .formGrid.three{grid-template-columns:repeat(3,1fr)}
    .field label{display:block;font-weight:600;margin-bottom:7px;color:#334155;font-size:14px;}
    .field input,.field select,.field textarea{width:100%;border:1px solid #CBD5E1;border-radius:6px;background:#fff;padding:10px 11px;font-size:14px;transition:border-color 0.2s;}
    .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue3);}
    .field textarea{min-height:92px;resize:vertical}
    .field.full{grid-column:1/-1}
    .tabs{display:flex;gap:20px;border-bottom:1px solid var(--border);padding:0 18px}
    .tab{height:42px;display:flex;align-items:center;border-bottom:3px solid transparent;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;transition:all 0.2s;}
    .tab:hover{color:var(--text);}
    .tab.active{border-color:var(--blue);color:var(--blue)}
    .filters{display:flex;flex-wrap:wrap;gap:10px;padding:14px 18px}
    .filters select,.filters input{height:36px;border:1px solid #CBD5E1;border-radius:6px;background:#fff;padding:0 10px}
    table{width:100%;border-collapse:collapse;font-size:14px}
    .tableWrap{padding:0 14px 14px;overflow:auto}
    th,td{padding:12px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
    th{background:#F1F5F9;font-weight:600;color:#334155}
    td{font-family:'Fira Code', monospace;}
    tr{transition:background-color 0.15s;}
    tr:hover td{background:var(--blue3)}
    .tag{display:inline-flex;align-items:center;justify-content:center;border-radius:6px;padding:4px 8px;font-size:12px;font-weight:600;border:1px solid transparent;font-family:'Fira Sans', sans-serif;}
    .tagRed{background:#FEF2F2;color:#DC2626;border-color:#FECACA}
    .tagBlue{background:#EFF6FF;color:#2563EB;border-color:#BFDBFE}
    .tagGreen{background:#ECFDF5;color:#059669;border-color:#A7F3D0}
    .tagOrange{background:#FFFBEB;color:#D97706;border-color:#FDE68A}
    .tagPurple{background:#F5F3FF;color:#7C3AED;border-color:#DDD6FE}
    .tagGray{background:#F8FAFC;color:#475569;border-color:#E2E8F0}
    .tagDark{background:#0F172A;color:#fff}
    .detailGrid{display:grid;grid-template-columns:110px 1fr;gap:10px 8px;font-size:14px}
    .detailGrid .label{font-weight:600;color:var(--muted)}
    .divider{height:1px;background:var(--border);margin:14px 0}
    .progressLine{display:grid;grid-template-columns:repeat(6,1fr);gap:0;position:relative;margin:12px 0}
    .progressLine:before{content:"";position:absolute;left:7%;right:7%;top:17px;height:3px;background:var(--border)}
    .step{text-align:center;position:relative;z-index:1;font-size:12px;color:var(--muted);font-weight:600}
    .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;margin:0 auto 7px;background:#fff;border:2px solid var(--border);transition:all 0.3s;}
    .step.active .dot{background:var(--blue);border-color:var(--blue);color:#fff}
    .step.done .dot{background:var(--green);border-color:var(--green);color:#fff}
    .step.done{color:var(--green)}
    .logBox{background:#0F172A;color:#E2E8F0;border-radius:8px;padding:12px;height:260px;overflow:auto;font-family:'Fira Code', monospace;font-size:12px;line-height:1.6}
    .toast{position:fixed;right:20px;bottom:20px;background:#0F172A;color:#fff;padding:12px 16px;border-radius:8px;box-shadow:0 10px 25px rgba(0,0,0,.25);opacity:0;pointer-events:none;transform:translateY(10px);transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);z-index:100}
    .toast.show{opacity:1;transform:translateY(0)}
    .modalBackdrop{position:fixed;inset:0;background:rgba(15,23,42,.6);display:none;align-items:center;justify-content:center;z-index:90;padding:20px;opacity:0;transition:opacity 0.2s ease-out;}
    .modalBackdrop.show{display:flex;opacity:1;}
    .modal{background:#fff;border-radius:12px;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);max-width:760px;width:100%;max-height:86vh;overflow:auto;transform:scale(0.95);transition:transform 0.2s ease-out;}
    .modalBackdrop.show .modal{transform:scale(1);}
    .modalHeader{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
    .modalBody{padding:20px}
    .modalFooter{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;background:#F8FAFC;border-radius:0 0 12px 12px;}
    .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .miniCard{border:1px solid var(--border);background:#fff;border-radius:8px;padding:14px;cursor:pointer;transition:all 0.2s;}
    .miniCard:hover{outline:2px solid var(--blue);transform:translateY(-2px);}
    .miniCard.active{outline:2px solid var(--blue);background:var(--blue3);}
    .miniCard .big{font-size:28px;font-weight:700;margin-top:6px;font-family:'Fira Code', monospace;}
    .bar{height:8px;background:var(--border);border-radius:999px;overflow:hidden}
    .bar span{display:block;height:100%;background:var(--blue);border-radius:999px}
    .flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .flowNode{background:var(--blue3);color:var(--blue);border:1px solid #BFDBFE;border-radius:6px;padding:8px 12px;font-weight:600;font-size:13px;}
    .arrow{color:var(--muted);font-weight:600}
    .empty{padding:40px;text-align:center;color:var(--muted);font-size:14px;}
    .warnBox{background:#FFFBEB;border:1px solid #FDE68A;color:#B45309;border-radius:6px;padding:12px;line-height:1.6;font-size:14px;}
    .okBox{background:#ECFDF5;border:1px solid #A7F3D0;color:#047857;border-radius:6px;padding:12px;line-height:1.6;font-size:14px;}
    .badBox{background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C;border-radius:6px;padding:12px;line-height:1.6;font-size:14px;}
    .metricGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
    .metric{border:1px solid var(--border);background:#fff;border-radius:8px;padding:14px}
    .metric .label{color:var(--muted);font-size:12px;font-weight:700}
    .metric .value{font-size:28px;font-weight:900;font-family:'Fira Code',monospace;margin-top:6px}
    .scopePill{display:inline-flex;align-items:center;gap:6px;background:#F1F5F9;color:#334155;border:1px solid var(--border);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}
    .wrap{white-space:normal;line-height:1.5}
    .caseLink{color:var(--blue);font-weight:600;text-decoration:none;font-family:'Fira Code',monospace;cursor:pointer}
    .caseLink:hover{text-decoration:underline;color:var(--blue2)}
    .checkbox{display:inline-block;width:16px;height:16px;border:1px solid var(--muted);border-radius:4px;background:#fff;transition:all 0.2s;}
    .checkbox:hover{border-color:var(--blue);}
    .img-preview{width:100%;height:140px;background:#E2E8F0;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#94A3B8;cursor:pointer;border:1px dashed #CBD5E1;overflow:hidden;position:relative;}
    .img-preview img{width:100%;height:100%;object-fit:cover;display:block;}
    .img-preview:hover{border-color:var(--blue);box-shadow:0 0 0 2px rgba(29,111,232,.15);}
    .img-preview::after{content:'🔍';position:absolute;right:6px;bottom:6px;font-size:11px;background:rgba(255,255,255,.85);border-radius:4px;padding:2px 5px;opacity:0;transition:opacity .15s;}
    .img-preview:hover::after{opacity:1;}
    .photo-thumb-row{display:flex;gap:8px;flex-wrap:wrap;}
    .imageLightbox{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:32px 56px;}
    .imageLightbox.show{display:flex;}
    .imageLightbox-backdrop{position:absolute;inset:0;background:rgba(15,23,42,.92);}
    .imageLightbox img{position:relative;z-index:1;max-width:min(92vw,1100px);max-height:82vh;object-fit:contain;border-radius:8px;box-shadow:0 24px 64px rgba(0,0,0,.45);background:#0f172a;}
    .imageLightbox-caption{position:absolute;z-index:1;bottom:20px;left:50%;transform:translateX(-50%);color:#fff;font-size:14px;background:rgba(15,23,42,.75);padding:8px 16px;border-radius:8px;max-width:90vw;text-align:center;}
    .imageLightbox-close{position:absolute;z-index:2;top:16px;right:20px;width:40px;height:40px;border:none;border-radius:8px;background:rgba(255,255,255,.15);color:#fff;font-size:22px;cursor:pointer;line-height:1;}
    .imageLightbox-close:hover{background:rgba(255,255,255,.25);}
    .imageLightbox-nav{position:absolute;z-index:2;top:50%;transform:translateY(-50%);width:44px;height:44px;border:none;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:28px;cursor:pointer;line-height:1;}
    .imageLightbox-nav:hover{background:rgba(255,255,255,.28);}
    .imageLightbox-nav.prev{left:16px;}
    .imageLightbox-nav.next{right:16px;}
    @media(max-width:1300px){.kpiGrid{grid-template-columns:repeat(3,1fr)}.metricGrid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.app{grid-template-columns:220px 1fr}.sidebar{width:220px}.brand{font-size:16px}.cycleBox{min-width:200px}.main{min-width:900px}}
    /* 登入頁 */
    .loginPage{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
    .loginBrand{background:linear-gradient(145deg,#1D6FE8 0%,#1557C0 55%,#0F4A9E 100%);color:#fff;padding:48px 56px;display:flex;flex-direction:column;position:relative;overflow:hidden}
    .loginBrand::before{content:"";position:absolute;top:-80px;right:-80px;width:320px;height:320px;border-radius:50%;background:rgba(255,255,255,.08)}
    .loginBrand::after{content:"";position:absolute;bottom:-120px;left:-60px;width:400px;height:400px;border-radius:50%;background:rgba(255,255,255,.05)}
    .loginBrandInner{position:relative;z-index:1;flex:1;display:flex;flex-direction:column}
    .loginSnow{font-size:28px;margin-bottom:20px;opacity:.95}
    .loginBrand h1{margin:0 0 10px;font-size:36px;font-weight:700;letter-spacing:1px}
    .loginBrand .sub{font-size:15px;opacity:.88;margin-bottom:36px}
    .loginFeatures{list-style:none;margin:0;padding:0;font-size:15px;line-height:2.2;opacity:.92}
    .loginFeatures li::before{content:"• ";opacity:.7}
    .loginGuestLink{margin-top:auto;padding-top:40px}
    .loginGuestLink a{color:#fff;text-decoration:none;font-size:14px;opacity:.85;display:inline-flex;align-items:center;gap:6px}
    .loginGuestLink a:hover{opacity:1;text-decoration:underline}
    .loginFormSide{background:#F5F7FA;display:flex;align-items:flex-start;justify-content:center;padding:32px 28px;overflow:auto;max-height:100vh}
    .loginCard{width:100%;max-width:520px}
    .loginCard h2{margin:0 0 6px;font-size:26px;font-weight:700;color:#1E293B}
    .loginCard .loginHint{color:#64748B;font-size:14px;margin-bottom:18px}
    .loginFilters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
    .loginFilterBtn{border:1px solid #E2E8F0;background:#fff;color:#475569;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
    .loginFilterBtn:hover{border-color:#2563EB;color:#2563EB}
    .loginFilterBtn.active{background:#2563EB;border-color:#2563EB;color:#fff}
    .loginDeptSelect{width:100%;height:38px;border:1px solid #E2E8F0;border-radius:8px;padding:0 10px;font-size:13px;margin-bottom:12px;background:#fff}
    .loginAccountList{display:flex;flex-direction:column;gap:8px;max-height:min(58vh,520px);overflow:auto;padding-right:4px}
    .loginAccountItem{display:flex;align-items:center;gap:12px;width:100%;border:1px solid #E2E8F0;background:#fff;border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;transition:all .15s}
    .loginAccountItem:hover{border-color:#2563EB;box-shadow:0 4px 12px rgba(37,99,235,.12);transform:translateY(-1px)}
    .loginAccountItem .avatarSm{width:40px;height:40px;border-radius:50%;background:#2563EB;color:#fff;display:grid;place-items:center;font-weight:700;flex-shrink:0}
    .loginAccountItem .info{flex:1;min-width:0}
    .loginAccountItem .name{font-weight:700;font-size:15px;color:#1E293B}
    .loginAccountItem .meta{font-size:12px;color:#64748B;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .loginAccountItem .roleBadge{font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;flex-shrink:0}
    .roleBadge-一般員工{background:#F1F5F9;color:#475569}
    .roleBadge-稽核人員{background:#EFF6FF;color:#1D4ED8}
    .roleBadge-管理部承辦{background:#F5F3FF;color:#6D28D9}
    .roleBadge-管理部主管{background:#FDF2F8;color:#DB2777}
    .loginCount{font-size:12px;color:#94A3B8;margin-bottom:10px}
    .loginLinks{display:flex;justify-content:flex-end;margin-top:14px;font-size:14px}
    .loginLinks a{color:#64748B;text-decoration:none}
    .loginLinks a:hover{color:#2563EB;text-decoration:underline}
    .loginTip{margin-top:16px;padding:12px 14px;background:#fff;border:1px solid #E2E8F0;border-radius:8px;font-size:13px;color:#64748B;line-height:1.6}
    .hidden{display:none!important}
    .btnLogout{height:32px;padding:0 12px;font-size:13px}
    @media(max-width:900px){.loginPage{grid-template-columns:1fr}.loginBrand{padding:32px 28px;min-height:auto}.loginBrand h1{font-size:28px}}
  </style>
</head>
<body>

<!-- 登入頁 -->
<div id="loginPage" class="loginPage">
  <div class="loginBrand">
    <div class="loginBrandInner">
      <div class="loginSnow">❄</div>
      <h1>冰點集團 OA</h1>
      <div class="sub">冰點集團員工 OA 管理後台</div>
      <ul class="loginFeatures">
        <li>BPM 簽核線上處理</li>
        <li>通訊錄 / 文件下載 / 公告</li>
        <li>個人捷徑與通知中心</li>
      </ul>
      <div class="loginGuestLink"><a href="#" id="guestLoginLink">→ 訪客模式進入</a></div>
    </div>
  </div>
  <div class="loginFormSide">
    <div class="loginCard">
      <h2>Demo 快速登入</h2>
      <div class="loginHint">點選帳號即可進入，無需輸入密碼（原型驗證用）</div>
      <div class="loginFilters" id="loginRoleFilters">
        <button type="button" class="loginFilterBtn active" data-login-role="全部">全部</button>
        <button type="button" class="loginFilterBtn" data-login-role="一般員工">一般員工</button>
        <button type="button" class="loginFilterBtn" data-login-role="稽核人員">稽核人員</button>
        <button type="button" class="loginFilterBtn" data-login-role="管理部承辦">管理部承辦</button>
        <button type="button" class="loginFilterBtn" data-login-role="管理部主管">管理部主管</button>
      </div>
      <select id="loginDeptFilter" class="loginDeptSelect">
        <option value="全部部門">全部部門</option>
      </select>
      <div class="loginCount" id="loginAccountCount"></div>

function calculateVerifyDate(improveEnd) {
  if (!improveEnd) return '';
  let d = new Date(improveEnd);
  if (isNaN(d.getTime())) return '';
  do {
    d.setDate(d.getDate() + 1);
  } while (d.getDay() === 0 || d.getDay() === 6);
  return d.toISOString().slice(0, 10);
}
function getWeekNum(d) {
  const date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  date.setHours(0, 0, 0, 0);
  const day = date.getDay();
  const diff = (day === 0 ? -3 : 4 - day);
  date.setDate(date.getDate() + diff);
  const jan4 = new Date(date.getFullYear(), 0, 4);
  const jan4Day = jan4.getDay();
  const jan4Diff = (jan4Day === 0 ? -3 : 4 - jan4Day);
  jan4.setDate(jan4.getDate() + jan4Diff);
  return 1 + Math.round((date.getTime() - jan4.getTime()) / 86400000 / 7);
}
function dateKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dateTimeValue(d, hhmm){
  return `${dateKey(d)}T${hhmm}`;
}
function parseDateKey(s){
  if(!s) return null;
  const m = String(s).trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return null;
  const d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
  if(isNaN(d.getTime())) return null;
  return d;
}
function calendarMap(){
  const map = new Map();
  (state.companyCalendar || []).forEach(d => map.set(d.date, d));
  return map;
}
function defaultWorkday(d){
  return d.getDay() !== 0 && d.getDay() !== 6;
}
function isCompanyWorkday(d, map=calendarMap()){
  const item = map.get(dateKey(d));
  if(item) return item.isWorkday === true;
  return defaultWorkday(d);
}
function firstWorkdayBetween(start, end, map=calendarMap()){
  const d = new Date(start);
  while(d <= end){
    if(isCompanyWorkday(d, map)) return new Date(d);
    d.setDate(d.getDate() + 1);
  }
  return null;
}
function lastWorkdayBetween(start, end, map=calendarMap()){
  const d = new Date(end);
  while(d >= start){
    if(isCompanyWorkday(d, map)) return new Date(d);
    d.setDate(d.getDate() - 1);
  }
  return null;
}
function nextCompanyWorkday(fromDate, map=calendarMap()){
  const d = new Date(fromDate);
  d.setDate(d.getDate() + 1);
  for(let i=0;i<20;i++){
    if(isCompanyWorkday(d, map)) return new Date(d);
    d.setDate(d.getDate() + 1);
  }
  return d;
}
function calculateVerifyDateByCalendar(improveEnd, map=calendarMap()){
  if(!improveEnd) return '';
  const d = new Date(improveEnd);
  if(isNaN(d.getTime())) return '';
  return dateKey(nextCompanyWorkday(d, map));
}
function getCycle() {
  const currentTime = now();
  const list = state.cycles || [state.cycle || DEFAULT_CYCLE];
  let found = list.find(c => isBetween(currentTime, c.openStart, c.openEnd));
  if (found) return found;
  found = list.find(c => isBetween(currentTime, c.improveStart, c.improveEnd));
  if (found) return found;
  const curMs = dt(currentTime).getTime();
  let closest = null;
  let minDiff = Infinity;
  for (const c of list) {
    const diff = Math.abs(dt(c.openStart).getTime() - curMs);
    if (diff < minDiff) {
      minDiff = diff;
      closest = c;
    }
  }
  return closest || list[0] || DEFAULT_CYCLE;
}
function getCycleForCase(c) {
  if (c.cycleId && state.cycles) {
    const found = state.cycles.find(cy => cy.id === c.cycleId);
    if (found) return found;
  }
  const time = c.createdAt || now();
  const list = state.cycles || [state.cycle || DEFAULT_CYCLE];
  if (c.due) {
    const found = list.find(cy => cy.improveEnd === c.due);
    if (found) return found;
  }
  let found = list.find(cy => isBetween(time, cy.openStart, cy.improveEnd));
  if (found) return found;
  return getCycle();
}
function getTrackingQuarters(){

function quarterBounds(q){
  const [y, qq] = q.split('-Q');

  const starts = {1:'01-01', 2:'04-01', 3:'07-01', 4:'10-01'};
  const ends = {1:'03-31', 2:'06-30', 3:'09-30', 4:'12-31'};
  return {
    quarterStart: `${year}-${starts[qq]}T08:00`,
    quarterEnd: `${year}-${ends[qq]}T17:00`
  };
}

function bumpLegacyYear2025InPlace(){
  let changed = false;
  const replaceYear = value => {
    if(typeof value !== 'string' || !value.includes('2025')) return value;
    changed = true;
    return value.replace(/2025/g, '2026');
  };
  ['simTime','scoreSelectedQ'].forEach(k => { if(state[k]) state[k] = replaceYear(state[k]); });
  if(state.cycle){
    ['id','openStart','openEnd','improveStart','improveEnd','verifyDate','quarter','quarterStart','quarterEnd'].forEach(k => {
      if(state.cycle[k]) state.cycle[k] = replaceYear(state.cycle[k]);
    });
  }
  (state.cycles || []).forEach(c => {
    ['id','openStart','openEnd','improveStart','improveEnd','verifyDate','quarter','quarterStart','quarterEnd'].forEach(k => {
      if(c[k]) c[k] = replaceYear(c[k]);
    });
  });
  (state.cases || []).forEach(c => {
    ['id','createdAt','due','rejectDue','closeAt','cycleId','trackingQuarter','updatedAt'].forEach(k => {
      if(c[k]) c[k] = replaceYear(c[k]);
    });
    if(c.appealMeta?.submittedAt) c.appealMeta.submittedAt = replaceYear(c.appealMeta.submittedAt);
    if(c.trackingMeta?.quarter) c.trackingMeta.quarter = replaceYear(c.trackingMeta.quarter);
    if(c.trackingMeta?.submittedAt) c.trackingMeta.submittedAt = replaceYear(c.trackingMeta.submittedAt);
  });
  (state.bonus || []).forEach(b => {
    ['id','createdAt','week','closeWeek'].forEach(k => {
      if(b[k]) b[k] = replaceYear(b[k]);
    });
  });
  (state.auditAssignments || []).forEach(a => {
    ['cycleId','confirmedAt'].forEach(k => {
      if(a[k]) a[k] = replaceYear(a[k]);
    });
  });
  if(state.published){
    ['at','quarter','year'].forEach(k => {
      if(state.published[k]) state.published[k] = replaceYear(String(state.published[k]));
    });
  }
  return changed;
}

    state.cycles.push({
      id: '2026-W26',
      openStart: '2026-06-22T08:00',
      openEnd: '2026-06-26T17:00',
      improveStart: '2026-06-29T08:00',
      improveEnd: '2026-07-03T17:00',
      verifyDate: '2026-07-06',
      quarter: '2026-Q2',
      quarterStart: '2026-04-01T08:00',
      quarterEnd: '2026-06-30T17:00'
    });
  }
  state.cycles.sort((a, b) => a.id.localeCompare(b.id));
  
  if (state.auditAssignments) {
    state.auditAssignments.forEach(a => {
      if (a.cycleId === '2026-W25') {
        a.cycleId = '2026-W26';
      }
    });
  }
  state.cases.forEach(c => {
    if (c.cycleId === '2026-W25') c.cycleId = '2026-W26';
  });
  if (state.bonus) {
    state.bonus.forEach(b => {
      if (b.week === '2026-W25') b.week = '2026-W26';
      if (b.closeWeek === '2026-W25') b.closeWeek = '2026-W26';
    });
  }
  save();
}

function dt(s){ return new Date(s); }
function fmt(s){ if(!s) return '-'; const d=dt(s); return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function fmtShort(s){ const d=dt(s); return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function now(){ return state.simTime; }
function isBetween(t,a,b){ const x=dt(t).getTime(); return x>=dt(a).getTime() && x<=dt(b).getTime(); }
function inOpenWeek(){ const c = getCycle(); return isBetween(now(), c.openStart, c.openEnd); }
function inImproveWeek(){ const c = getCycle(); return isBetween(now(), c.improveStart, c.improveEnd); }
function currentQuarter(t=now()){
  const m = dt(t).getMonth()+1; const y = dt(t).getFullYear();
  if(m<=3) return `${y}-Q1`; if(m<=6) return `${y}-Q2`; if(m<=9) return `${y}-Q3`; return `${y}-Q4`;
}
function quarterRange(q){
  const [y,qq] = q.split('-Q'); const year=Number(y);
  const ranges={1:['01/01','03/31'],2:['04/01','06/30'],3:['07/01','09/30'],4:['10/01','12/31']};
  return `${year}/${ranges[qq][0]} ~ ${year}/${ranges[qq][1]}`;
}

}
function isManagementClerk(role = state.role){

}
function isManagementSupervisor(role = state.role){
  return role === '管理部主管';
}
function canManageAll(){ return isManagementStaff(); }
function canAuditCase(c){ return state.role === '稽核人員' && c.auditor === state.userName; }
function canMaintainMasters(){ return isManagementClerk(); }

}
function canAccessModule(id){
  if(id === 'newDeduct') return canRole('createDeduct');

}
function defaultModuleForRole(role){
  const allowed = roleModuleMap[role] || roleModuleMap['一般員工'];

}

function getVisibleCases(){
  if (isManagementStaff()) {
    return state.cases;
  }
  if (state.role === '稽核人員') {
    return state.cases.filter(c => {
      const isMyDept = c.dept === state.dept && c.status !== '草稿';
      const isMyAudited = c.auditor === (state.userName || '王小明');
      return isMyDept || isMyAudited;
    });
  }
  return state.cases.filter(c => c.dept === state.dept && c.status !== '草稿');
}
function getPendingAuditorReviewCases(cases=getVisibleCases()){
  if (isManagementClerk()) {
    return cases.filter(c => ['待管理部審核', '申訴中'].includes(c.status));
  }
  if (isManagementSupervisor()) {
    return cases.filter(c => ['待主管核准', '申訴待主管核准'].includes(c.status));
  }
  return [];
}
function getPendingBonusReviewCases(bonus = getVisibleBonus()){
  if (isManagementClerk()) {
    return bonus.filter(b => ['待管理部初審', '待管理部同仁核對'].includes(b.status));
  }
  if (isManagementSupervisor()) {
    return bonus.filter(b => b.status === '待管理部主管核准');
  }
  return [];
}
function getVisibleBonus(){
  if (isManagementStaff()) {
    return state.bonus;
  }
  return state.bonus.filter(b => b.proposer === state.dept || b.targetDept === state.dept);
}

function getVisibleImprovementCases(){
  const cases = state.cases.filter(c => c.dept === state.dept);
  const bonus = state.bonus.filter(b => b.targetDept === state.dept);
  return [
    ...cases
      .filter(c => ['待改善', '逾期未改', '待管理部審核'].includes(c.status))
      .map(c => ({
        source: '缺失單',
        id: c.id,
        createdAt: c.createdAt,
        area: c.area || '—',
        dept: c.dept || '—',
        title: c.desc || c.category || '—',
        status: c.status,
        due: c.due,
        scoreText: (c.overduePenaltyApplied || c.status === '逾期未改')
          ? String((c.originalScore !== undefined ? c.originalScore : c.score) - 10)
          : String(c.score),
        scoreColor: 'var(--red)',
        action: 'openCaseModal'
      })),
    ...bonus
      .filter(b => ['待責任單位改善', '待管理部同仁核對', '待管理部主管核准'].includes(b.status))
      .map(b => ({
        source: '加分單',
        id: b.id,
        createdAt: b.createdAt,
        area: b.area || '—',
        dept: b.targetDept || '—',
        title: b.title || b.desc || '—',
        status: b.status,
        due: '結案後計分',
        scoreText: '提報 +2 / 責任 +1',
        scoreColor: 'var(--green)',
        action: 'openBonusModal'
      }))
  ].sort((a,b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
}

function canOperateCase(c, action){
  if(!c) return false;
  if(action==='improve') return c.dept === state.dept && ['待改善','逾期未改'].includes(c.status);
  if(action==='appeal') return c.dept === state.dept && c.status === '待改善';
  if(action==='verify') return isManagementSupervisor() && c.status === '待主管核准';
  if(action==='reject') {
    if(c.status === '待管理部審核') return isManagementClerk();
    if(c.status === '待主管核准') return isManagementSupervisor();
    return false;
  }
  if(action==='processAppeal') {
    if(c.status === '申訴中') return isManagementClerk();
    if(c.status === '申訴待主管核准') return isManagementSupervisor();
    return false;
  }
  if(action==='trackingComplete') return isManagementClerk() && c.status === '前期追蹤';
  return false;
}

// 計算單一部門在指定案件清單與加分清單中的分數明細
// casesArr / bonusArr 可傳入過濾後的清單（供季度/年度計算使用）
function scoreDetailByDept(dept, casesArr, bonusArr){
  casesArr = casesArr || state.cases;
  bonusArr = bonusArr || state.bonus;
  const detail=[];
  let deduct=0, overdue=0, bonus=0;
  let safetyCount=0, disciplineCount=0;
  casesArr.forEach(c=>{
    if(c.dept!==dept || c.status==='作廢' || c.status==='草稿' || c.status==='前期追蹤') return;
    const origScore = (c.originalScore !== undefined) ? c.originalScore : c.score;
    deduct += origScore;
    detail.push({id:c.id, text:`${c.category} 扣分`, score:origScore});
    if(c.overduePenaltyApplied || c.status==='逾期未改'){
      overdue -= 10;
      detail.push({id:c.id, text:'逾期未改額外扣 10 分', score:-10});
    }
    if(c.category==='安全') safetyCount++;
    if(c.category==='教養') disciplineCount++;
  });
  bonusArr.forEach(b=>{
    if(b.status!=='已結案') return;
    if(b.proposer===dept){
      bonus += 2;
      detail.push({id:b.id, text:'加分單結案 (提報單位加分)', score:2});
    }
    if(b.targetDept===dept){
      bonus += 1;
      detail.push({id:b.id, text:'加分單結案 (責任單位改善完成加分)', score:1});
    }
  });
  const net = deduct + overdue + bonus; // 負數表示有扣分；0 為最佳
  return {dept, deduct, overdue, bonus, net, safetyCount, disciplineCount, detail};
}
function allScoreDetails(casesArr, bonusArr){
  return getDeptNames(false).map(d => scoreDetailByDept(d, casesArr, bonusArr));
}
// 取得某季所有已成立（非作廢/草稿）的案件
function casesByQuarter(q){
  const bounds = quarterBounds(q);
  return state.cases.filter(c=>{
    if(c.status==='作廢' || c.status==='草稿' || c.status==='前期追蹤') return false;
    const cy = getCycleForCase(c);
    const cq = cy ? cy.quarter : currentQuarter(c.createdAt);
    return cq === q;
  });
}
// 取得某季已結案且結案週屬於該季的加分單
function bonusByQuarter(q){
  const bounds = quarterBounds(q);
  return state.bonus.filter(b=>{
    if(b.status!=='已結案') return false;
    // 用結案週所屬季度判斷
    if(!b.closeWeek) return false;
    // closeWeek 格式 2026-W24，找對應的 cycle 季度
    const cy = (state.cycles||[]).find(c=>c.id===b.closeWeek);
    if(cy) return cy.quarter === q;
    return false;
  });
}
// 取得某年所有已成立案件
function casesByYear(year){
  return state.cases.filter(c=>{
    if(c.status==='作廢' || c.status==='草稿' || c.status==='前期追蹤') return false;
    return c.createdAt && c.createdAt.startsWith(String(year));
  });
}
// 取得某年已結案加分單
function bonusByYear(year){
  return state.bonus.filter(b=>{
    if(b.status!=='已結案' || !b.closeWeek) return false;
    const cy = (state.cycles||[]).find(c=>c.id===b.closeWeek);
    if(cy && cy.quarter) return cy.quarter.startsWith(String(year)+'-Q');
    return false;
  });
}
// 對 allScoreDetails 結果依排名規則排序（net 降序 → safetyCount 升序 → disciplineCount 升序）
function rankScores(scores){
  return [...scores].sort((a,b)=>{
    if(a.net !== b.net) return b.net - a.net; // net 越大越好（+5 > -5 > -14）
    if(a.safetyCount !== b.safetyCount) return a.safetyCount - b.safetyCount;
    return a.disciplineCount - b.disciplineCount;
  });
}

  if(step==='待主管核准' || step==='主管核准') return ['待主管核准','已結案','申訴待主管核准'].includes(status);

  return false;
}

      ...pBonus.map(b => ({

        id: b.id,
        createdAt: b.createdAt,

        createdAt: b.createdAt,

        status: b.status,
        due: '—',

      allRows = allRows.filter(x => x.source === '缺失單' && x.category === state.auditFilters.category);

        x.id.toLowerCase().includes(kw) || 
        x.area.toLowerCase().includes(kw) || 
        (x.source === '缺失單' ? (x.raw?.desc || '').toLowerCase().includes(kw) : (x.raw?.title || '' + x.raw?.desc || '').toLowerCase().includes(kw))

  allRows.sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));

  const scope = state.role === '稽核人員' ? visibleScopeText('audit') : (canManageAll() || isManagementSupervisor() ? '全公司案件' : visibleScopeText('dept'));
  const draftCount = vCases.filter(c=>c.status==='草稿').length;
  
  const auditTabs = ['全部'];
  if (state.role === '管理部' || isManagementSupervisor()) {

    auditTabs.push({id:'待我審核', count: pendingReviewCount});

  return `<div class="pageTitle">
    <div>
      <h1>案件清單</h1>
      <div class="hint">缺失單與加分單在此統一管理與審核。缺失單由稽核員開立；加分單由同仁主動提報。</div>

    </div>
  </div>
  <div class="panel">
    <div class="tabs">${auditTabs.map(t=>{
      const id = typeof t === 'string' ? t : t.id;
      const label = typeof t === 'string' ? t : `${t.id}${t.count ? ` (${t.count})` : ''}`;
      return `<div class="tab ${state.filterStatus===id?'active':''}" data-action="filterStatus" data-status="${id}">${label}</div>`;
    }).join('')}</div>
    ${isPendingReviewTab ? `<div class="hint" style="padding:0 16px 8px;color:var(--purple)">此分頁僅顯示目前需你處理的審核案件，狀態篩選已自動套用。</div>` : ''}
    <div class="filters">
      <input type="date" id="auditFilterDate" value="${state.auditFilters?.date || ''}" title="日期">
      <select id="auditFilterDept"><option>全部部門</option>${getDeptNames(false).map(d=>`<option ${state.auditFilters?.dept===d?'selected':''}>${d}</option>`).join('')}</select>
      <select id="auditFilterCategory"><option>全部缺失項目</option>${getActiveCategories().map(c=>`<option ${state.auditFilters?.category===c.name?'selected':''}>${c.name}</option>`).join('')}</select>
      <select id="auditFilterStatus" ${isPendingReviewTab ? 'disabled title="待我審核分頁已固定顯示待審核與待核准案件"' : ''}>
        <option>全部狀態</option>
        ${['草稿','待改善','待責任單位改善','待管理部審核','待管理部初審','待管理部同仁核對','待主管核准','待管理部主管核准','已結案','申訴中','申訴待主管核准','逾期未改','前期追蹤','作廢','已駁回'].map(s=>`<option ${!isPendingReviewTab && state.auditFilters?.status===s?'selected':''}>${s}</option>`).join('')}
      </select>
      <input type="text" id="auditSearch" placeholder="搜尋編號,區域,主旨..." value="${state.auditFilters?.keyword || ''}">
      <button class="btn btnPrimary" data-action="applyAuditFilter">搜尋</button>
      <button class="btn btnLight" data-action="resetAuditFilter">重設</button>
    </div>
    ${isManager ? (()=>{
      const isClerk = isManagementClerk();
      const isSup = isManagementSupervisor();
      return `
      <div class="batch-toolbar" style="display:flex; align-items:center; gap:12px; padding:10px 16px; background-color:rgba(33, 150, 243, 0.05); border:1px solid rgba(33, 150, 243, 0.15); border-radius:6px; margin: 0 16px 16px 16px;">
        <span style="font-weight:bold; font-size:14px;">批次操作：</span>
        ${isClerk ? `<button class="btn btnPrimary" id="btnBatchManagerPass" data-action="batchManagerPass" disabled style="padding: 6px 12px; font-size: 13px; opacity:0.6; cursor:not-allowed;">批次初審通過</button>` : ''}
        ${isSup ? `<button class="btn btnGreen" id="btnBatchSupervisorPass" data-action="batchSupervisorPass" disabled style="padding: 6px 12px; font-size: 13px; opacity:0.6; cursor:not-allowed;">批次核准結案</button>` : ''}
        <span id="batchSelectMsg" style="font-size:12px; color:var(--muted)">請勾選下方案件進行操作</span>
      </div>

    })() : ''}
    ${renderCaseTable(allRows, { showAuditor: true, showSource: true })}
  </div>`;
}
function getEditingDraft(){
  return state.editingDraftId ? state.cases.find(c=>c.id===state.editingDraftId && c.status==='草稿') : null;
}
function readDeductForm(){
  const categoryRaw = document.getElementById('deductCategory')?.value || '';
  return {
    area: document.getElementById('deductArea')?.value?.trim() || '',
    dept: document.getElementById('deductDept')?.value || '',
    category: categoryRaw.split('（')[0],
    nature: document.getElementById('deductNature')?.value || '一般缺失',
    desc: document.getElementById('deductDesc')?.value?.trim() || ''
  };
}
function getAllowedAuditAreasForCurrentUser(){
  if(state.role !== '稽核人員') return [];
  const myTeam = getMyAuditTeam();
  const curCycle = getCycle();
  const confirmedAssign = getConfirmedAssignment(curCycle?.id);
  if(!myTeam || !confirmedAssign) return [];
  const myAssign = confirmedAssign.assignments.find(a => a.teamId === myTeam.id);
  return myAssign?.areas || [];
}
function openNewDeduct(draftId=''){
  if(!canRole('createDeduct')){ toast('權限不足：扣分項僅稽核人員可開單'); return; }
  state.editingDraftId = draftId || '';
  setModule('newDeduct');
}
function renderNewDeduct(){
  const draft = getEditingDraft();
  const logic = canRole('createDeduct') && inOpenWeek();
  const natureOptions = ['一般缺失','隨手問題','重大安全風險','季內累犯'];

  let restrictionMsg = '';

      if (confirmedAssign) {

        if (myAssign && myAssign.areas && myAssign.areas.length > 0) {
          availableAreas = availableAreas.filter(a => myAssign.areas.includes(a.name));
          restrictionMsg = `（您的組別為 ${myTeam.name}，本週限制稽核區域為：${myAssign.areas.join('、')}）`;

          availableAreas = [];
          restrictionMsg = `（您的組別為 ${myTeam.name}，本週沒有被分配任何稽核區域）`;

        availableAreas = [];

      }

      availableAreas = [];
      restrictionMsg = `（您尚未分配到任何稽核組別，請聯絡管理部設定）`;

  const deptOptions = getDeptNames().map(d=>`<option ${draft?.dept===d?'selected':''}>${d}</option>`).join('');
  const categoryOptions = getActiveCategories().map(c=>{
    const label = `${c.name}（${c.score}分）`;
    return `<option ${draft?.category===c.name?'selected':''}>${label}</option>`;
  }).join('');
  const natureSelect = natureOptions.map(n=>`<option ${(draft?.nature||'一般缺失')===n?'selected':''}>${n}</option>`).join('');

  <div class="${logic?'okBox':'badBox'}">目前登入者：${state.userName}｜職稱：${state.role}｜單位：${state.dept}｜目前時間：${fmt(now())}<br>扣分單開單條件：${logic?'符合，可以正式送出':'不符合，正式送出會被系統擋下（仍可先存草稿）'}</div>
  <br>
  <div class="panel">
    <div class="panelHeader"><div class="panelTitle">扣分單表單</div>${draft?`<span class="tag tagGray">草稿</span>`:''}</div>
    <div class="panelBody">
      <div class="formGrid">
        <div class="field"><label>稽核區域 <span style="color:var(--red)">*</span> <span style="font-size:12px;color:var(--muted);font-weight:normal;">${restrictionMsg}</span></label><select id="deductArea">${areaOptions}</select></div>
        <div class="field"><label>責任部門 <span style="color:var(--red)">*</span></label><select id="deductDept">${deptOptions}</select></div>
        <div class="field"><label>5S項目 <span style="color:var(--red)">*</span></label><select id="deductCategory">${categoryOptions}</select></div>
        <div class="field"><label>缺失性質</label><select id="deductNature">${natureSelect}</select></div>
        <div class="field full"><label>缺失描述 <span style="color:var(--red)">*</span></label><textarea id="deductDesc">${descValue}</textarea></div>
        <div class="field full"><label>照片佐證</label><input id="deductPhoto" type="file" multiple accept="image/*"><div class="hint" style="margin-top:6px">正式版將上傳至檔案伺服器；原型僅記錄有無附件。</div></div>
      </div>
      <div class="divider"></div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <button class="btn btnPrimary" data-action="submitDeduct">送出扣分單</button>
        <button class="btn btnLight" data-action="saveDeductDraft">儲存草稿</button>
        <button class="btn btnLight" data-action="cancelNewDeduct">返回案件清單</button>
      </div>
    </div>
  </div>`;
}

function renderBonusDetail(b){

  // 顯示駁回原因、改善說明、核對意見
  const reasonHtml = b.rejectReason ? `<div class="badBox" style="margin-bottom:12px"><b>退件/駁回原因：</b>${b.rejectReason}</div>` : '';

  const checkHtml = b.checkText ? `<div class="okBox" style="margin-bottom:12px"><b>管理部同仁核對意見：</b>${b.checkText}</div>` : '';

  const progressHtml = `
    <div class="progressLine" style="grid-template-columns: repeat(6, 1fr); margin-bottom: 24px;">
      ${steps.map((s, i) => `

          ${s}
        </div>

    </div>

  // 操作按鈕

    if (b.targetDept === state.dept) {
      actionsHtml += `
        <button class="btn btnPrimary" data-action="openBonusImproveForm" data-id="${b.id}">填寫改善說明</button>

    }

        <button class="btn btnDanger" data-action="openBonusCheckReject" data-id="${b.id}">退回責任單位</button>

    }
  } else if (b.status === '待管理部主管核准') {
    if (isManagementSupervisor()) {
      actionsHtml += `
        <button class="btn btnGreen" data-action="bonusSupervisorPass" data-id="${b.id}">核准結案 (正式計分)</button>
        <button class="btn btnDanger" data-action="openBonusSupervisorRejectToCheck" data-id="${b.id}">退回同仁核對</button>
        <button class="btn btnDanger" data-action="openBonusSupervisorRejectToImprove" data-id="${b.id}">退回責任單位</button>
      `;
    }
  }

  return `<div class="panel" style="box-shadow:none;border:none;"><div class="panelHeader"><div><div class="panelTitle">加分單明細</div><div style="font-size:22px;color:var(--green);font-weight:900;margin-top:8px">${b.id} ${tagStatus(b.status)}</div></div></div>
  <div class="panelBody">
    ${progressHtml}
    <div class="divider"></div>
    ${reasonHtml}
    ${improveHtml}
    ${checkHtml}
    <div class="detailGrid">
      <div class="label">提報時間：</div><div>${fmt(b.createdAt)}</div>
      <div class="label">提報單位：</div><div>${b.proposer} (加 2 分)</div>

      ${b.closeWeek ? `<div class="label">結案週：</div><div>${b.closeWeek}</div>` : ''}
      ${b.status === '已結案' ? `<div class="label">計分狀態：</div><div style="color:var(--green);font-weight:bold">已併入結案週 ${b.closeWeek} 計算分數 (提報單位 +2, 責任單位 +1)</div>` : ''}
    </div><div class="divider"></div>

function renderTracking(){

function renderReports(){

    row.deduct += origScore;

    if(['待管理部審核','待主管核准','申訴待主管核准','申訴中'].includes(c.status)) row.verify++;

    <tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.dept}</td><td style="font-weight:900;color:${r.net<-15?'var(--red)':r.net<-5?'var(--orange)':'var(--green)'}">${r.net>0?'+':''}${r.net}</td><td style="color:var(--red);font-weight:900">${r.deduct}</td><td style="color:var(--red);font-weight:900">${r.overduePenalty}</td><td style="color:var(--green);font-weight:900">+${r.bonus}</td><td>${r.open}</td><td>${r.verify}</td><td>${r.overdue}</td><td>${Math.round((r.closed/Math.max(r.cases,1))*100)}%</td></tr>`).join('') || '<tr><td colspan="10">目前範圍沒有資料</td></tr>'}</tbody></table></div>`;

// 建立排名表格 HTML（前 N 名，含並列邏輯）
function renderRankTable(rankedScores, topN, emptyMsg){
  if(!rankedScores.length) return `<div class="empty">${emptyMsg}</div>`;
  const top = rankedScores.slice(0, topN);
  const withRank = [];
  let rankNum = 1;
  for(let i=0; i<top.length; i++){
    if(i>0 && top[i].net===top[i-1].net && top[i].safetyCount===top[i-1].safetyCount && top[i].disciplineCount===top[i-1].disciplineCount){
      withRank.push({...top[i], rank: withRank[i-1].rank});
    } else {
      withRank.push({...top[i], rank: rankNum});
    }
    rankNum++;
  }
  const medalColor = r => r===1?'#F5A623':r===2?'#9B9B9B':r===3?'#CD7F32':'var(--text)';
  const medalIcon = r => r===1?'🥇':r===2?'🥈':r===3?'🥉':r;
  return `<div class="tableWrap"><table><thead><tr>
    <th>名次</th><th>部門</th><th>淨分數</th><th>一般分數</th><th>逾期分數</th><th>加分</th>
    <th>安全扣分筆數</th><th>教養扣分筆數</th>
  </tr></thead><tbody>
  ${withRank.map(s=>`<tr>
    <td style="font-weight:900;font-size:17px;color:${medalColor(s.rank)}">${medalIcon(s.rank)}</td>
    <td style="font-weight:700">${s.dept}</td>
    <td style="font-weight:900;color:${s.net<0?'var(--red)':s.net===0?'var(--green)':'var(--blue)'}">${s.net>0?'+':''}${s.net}</td>
    <td style="color:var(--red)">${s.deduct}</td>
    <td style="color:var(--red)">${s.overdue}</td>
    <td style="color:var(--green)">+${s.bonus}</td>
    <td>${s.safetyCount}</td>
    <td>${s.disciplineCount}</td>
  </tr>`).join('')}
  </tbody></table></div>`;
}

function buildDeductCase(form, status){
  const category = form.category;
  const score = category ? catObj(category).score : 0;
  const currentC = getCycle();
  return {
    type:'扣分',
    area:form.area,
    dept:form.dept,
    category,
    nature:form.nature,
    score,
    status,
    due: status==='草稿' ? '' : currentC.improveEnd,
    cycleId: currentC.id,
    desc:form.desc,
    appeal:'無',
    tracking:false,
    rejectDue:'',
    improveText:'',
    closeAt:''
  };
}
function saveDeductDraft(){
  if(!canRole('createDeduct')){ toast('權限不足：扣分項僅稽核人員可開單'); return; }
  const form = readDeductForm();
  const defaultDesc = '請輸入缺失描述，例如：滅火器前方堆放物品，影響緊急取用。';
  if(!form.area && !form.dept && (!form.desc || form.desc === defaultDesc)){
    toast('請至少填寫一項內容再儲存草稿'); return;
  }
  const draft = getEditingDraft();
  if(draft){
    Object.assign(draft, buildDeductCase(form, '草稿'), { updatedAt: now() });
    state.selectedCaseId = draft.id;
    log(`更新扣分草稿 ${draft.id}。`);
    toast('草稿已儲存');
  } else {
    const c = {
      id: nextId('CL', state.cases),
      createdAt: now(),
      auditor: state.userName || '王小明',
      ...buildDeductCase(form, '草稿')
    };
    state.cases.unshift(c);
    state.editingDraftId = c.id;
    state.selectedCaseId = c.id;
    log(`新增扣分草稿 ${c.id}。`);
    toast('已儲存為草稿');
  }
  save(); render();
}
function submitDeduct(){
  if(!canRole('createDeduct')){ toast('權限不足：扣分項僅稽核人員可開單'); log('扣分單送出失敗：目前職稱不是稽核人員。'); render(); return; }
  if(!inOpenWeek()){ toast('時間不符：目前不在開單週'); log('扣分單送出失敗：不在第1週週一08:00～週五17:00。'); render(); return; }
  const form = readDeductForm();
  const defaultDesc = '請輸入缺失描述，例如：滅火器前方堆放物品，影響緊急取用。';
  if(!form.area || !form.dept || !form.category || !form.desc || form.desc === defaultDesc){
    toast('請填寫所有必填欄位'); return;
  }
  const allowedAreas = getAllowedAuditAreasForCurrentUser();
  if(!allowedAreas.length){
    toast('尚未確認本週稽核區域分派，不能送出扣分單');
    log('扣分單送出失敗：本週稽核區域分派尚未確認或登入者未分組。');
    return;
  }

    log(`扣分單送出失敗：${state.userName} 嘗試開立未分派區域 ${form.area}。`);
    return;
  }
  const draft = getEditingDraft();
  const payload = buildDeductCase(form, '待改善');
  if(draft){
    Object.assign(draft, payload, { createdAt: draft.createdAt || now(), updatedAt: now() });
    state.selectedCaseId = draft.id;
    log(`扣分草稿 ${draft.id} 已正式送出：開單即成立，責任部門 ${form.dept}，${form.category} ${draft.score} 分。`);
  } else {
    const c = {
      id: nextId('CL', state.cases),
      createdAt: now(),
      auditor: state.userName || '王小明',
      ...payload
    };
    state.cases.unshift(c);
    state.selectedCaseId = c.id;
    log(`新增扣分單 ${c.id}：開單即成立，責任部門 ${form.dept}，${form.category} ${c.score} 分。`);

function submitAppeal(id){
  const c=state.cases.find(x=>x.id===id); if(!c) return;
  if(c.status === '逾期未改'){ toast('狀態為逾期未改，不可提出申訴'); return; }
  if(!canOperateCase(c,'appeal')){ toast('只能對所屬部門案件提出申訴'); return; }
  const typeVal = document.getElementById('appealType').value;
  const typeLabel = appealTypes.find(t=>t.value===typeVal)?.label || typeVal;
  const reason = document.getElementById('appealReason').value.trim();
  const note = document.getElementById('appealNote').value.trim();
  const suggestDept = document.getElementById('appealSuggestDept')?.value || '';
  const errEl = document.getElementById('appealFormError');
  if(!reason || reason.length < 10){
    errEl.style.display = 'block';
    errEl.textContent = '請填寫申訴原因，且至少 10 個字。';
    return;
  }
  if(typeVal==='dept_dispute' && !suggestDept){
    errEl.style.display = 'block';
    errEl.textContent = '責任單位爭議時，請選擇建議責任單位。';
    return;
  }
  const appealFiles = document.getElementById('appealPhoto')?.files;
  const hasPhoto = appealFiles?.length > 0;
  const appealPhotos = hasPhoto ? Array.from(appealFiles).map((f,i)=>({src:URL.createObjectURL(f), title:`申訴佐證 ${i+1}`})) : [];
  const appealMeta = {
    type: typeLabel,
    reason,
    note,
    suggestDept: typeVal==='dept_dispute' ? suggestDept : '',
    hasPhoto,
    appealPhotos,
    submittedBy: state.userName,
    submittedDept: state.dept,
    submittedAt: now()
  };
  c.status = '申訴中';
  c.appealMeta = appealMeta;
  c.appeal = `【${typeLabel}】${reason}${note ? '｜補充：'+note : ''}${suggestDept ? '｜建議責任單位：'+suggestDept : ''}${hasPhoto ? '｜已附佐證照片' : ''}`;
  log(`${c.id} 改善單位（${state.dept}）提出申訴：${typeLabel}。原因：${reason.slice(0,40)}${reason.length>40?'…':''}`);
  save(); closeModal(); toast('申訴已送出，等待稽核人員處理'); render();
}

function runDeadlineCheck(){
  let changed=0;
  state.cases.forEach(c=>{
    if(['已結案','作廢','申訴中','待管理部審核','待主管核准'].includes(c.status)) return;
    
    const due=c.due;
    const cy=getCycleForCase(c);
    const verifyDateLimit = cy && cy.verifyDate ? cy.verifyDate + 'T17:00' : null;
    
    let isExpired = false;
    if(due && dt(now())>dt(due)){
      isExpired = true;
    }
    if(verifyDateLimit && dt(now())>dt(verifyDateLimit)){
      isExpired = true;
    }
    
    if(isExpired && c.status!=='逾期未改'){
      c.status='逾期未改';
      c.rejectDue = '';
      c.rejectReason = '超過改善期限或複驗時間，系統自動列為逾期未改。';
      changed++;
      log(`${c.id} 超過改善期限或複驗時間，列為逾期未改。`);
    }
    
    if(c.status==='逾期未改' && !c.overduePenaltyApplied){
      c.originalScore = c.originalScore || c.score;
      c.overduePenaltyApplied = true;
      log(`${c.id} 已觸發逾期扣分規則，除了原扣分外額外扣 10 分。`);
      changed++;
    }
  });
  save(); toast(changed?`期限檢核完成：${changed} 件更新`:'期限檢核完成：無需更新'); render();
}

    return step === '提報送出';
  }
  if (step === '提報送出') return true;
  if (step === '管理部初審') return ['待管理部初審', '待責任單位改善', '待管理部同仁核對', '待管理部主管核准', '已結案'].includes(status);
  if (step === '責任單位改善') return ['待責任單位改善', '待管理部同仁核對', '待管理部主管核准', '已結案'].includes(status);
  if (step === '管理部同仁核對') return ['待管理部同仁核對', '待管理部主管核准', '已結案'].includes(status);
  if (step === '管理部主管核准') return ['待管理部主管核准', '已結案'].includes(status);
  if (step === '已結案') return status === '已結案';
  return false;
}
function bonusProgressStepClass(status, step) {
  if (status === '已結案' && step === '已結案') return 'active done';
  if (status === '已駁回') {
    if (step === '提報送出') return 'active done';
    return '';
  }
  const steps = ['提報送出', '管理部初審', '責任單位改善', '管理部同仁核對', '管理部主管核准', '已結案'];
  const curIdx = steps.indexOf(status === '待管理部初審' ? '管理部初審' :
                               status === '待責任單位改善' ? '責任單位改善' :
                               status === '待管理部同仁核對' ? '管理部同仁核對' :
                               status === '待管理部主管核准' ? '管理部主管核准' :
                               status === '已結案' ? '已結案' : '');
  const stepIdx = steps.indexOf(step);
  if (stepIdx < curIdx) return 'active done';
  if (stepIdx === curIdx) return 'active';
  return '';
}

function csvEscape(v){
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
}
function toCsv(rows){
  return rows.map(r => r.map(csvEscape).join(',')).join('\n');
}
function downloadTextFile(filename, content){
  const blob = new Blob(['\ufeff' + content], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

  toast('已下載行事曆範本');

function parseCsv(text){
  const rows = [];
  let row = [];
  let cell = '';
  let inQuotes = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    const next = text[i+1];
    if(ch === '"' && inQuotes && next === '"'){
      cell += '"'; i++;
    } else if(ch === '"'){
      inQuotes = !inQuotes;
    } else if(ch === ',' && !inQuotes){
      row.push(cell.trim()); cell = '';
    } else if((ch === '\n' || ch === '\r') && !inQuotes){
      if(ch === '\r' && next === '\n') i++;
      row.push(cell.trim());
      if(row.some(c => c !== '')) rows.push(row);
      row = []; cell = '';
    } else {
      cell += ch;
    }
  }
  row.push(cell.trim());
  if(row.some(c => c !== '')) rows.push(row);
  return rows;
}
function normalizeWorkday(v){
  const s = String(v ?? '').trim().toUpperCase();
  return ['Y','YES','TRUE','1','上班','補班','正常上班'].includes(s);
}

function importCompanyCalendar(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    try{
      const rows = parseCsv(evt.target.result);
      if(rows.length < 2) throw new Error('CSV 至少需包含標題列與一筆日期資料');
      const headers = rows[0].map(h => h.replace(/^\ufeff/,'').trim());
      const idx = name => headers.findIndex(h => h === name);
      const dateIdx = idx('date');
      const workdayIdx = idx('isWorkday');
      if(dateIdx < 0 || workdayIdx < 0) throw new Error('缺少必要欄位 date 或 isWorkday');
      const seen = new Set();
      const list = rows.slice(1).map((r, i) => {
        const date = r[dateIdx]?.trim();
        if(!parseDateKey(date)) throw new Error(`第 ${i+2} 行 date 格式錯誤，需為 YYYY-MM-DD`);
        if(seen.has(date)) throw new Error(`第 ${i+2} 行日期重複：${date}`);
        seen.add(date);
        return {
          date,
          weekday: r[idx('weekday')] || '',
          isWorkday: normalizeWorkday(r[workdayIdx]),
          workdayType: r[idx('workdayType')] || '',
          holidayName: r[idx('holidayName')] || '',
          remark: r[idx('remark')] || ''
        };
      }).sort((a,b) => a.date.localeCompare(b.date));
      state.companyCalendar = list;
      state.cycleImportPreview = null;
      save();
      log(`主檔異動：匯入公司行事曆 ${list.length} 天，上班日 ${list.filter(d=>d.isWorkday).length} 天。`);
      toast(`已匯入公司行事曆 ${list.length} 天`);
      render();
    } catch(err){
      alert(`公司行事曆匯入失敗：${err.message}`);
      log(`公司行事曆匯入失敗：${err.message}`);
    } finally {
      e.target.value = '';
    }
  };
  reader.readAsText(file);
}
function isCycleLocked(c){
  if(!c) return false;
  const hasCase = (state.cases || []).some(cs => cs.cycleId === c.id || cs.due === c.improveEnd);
  const hasConfirmedAssign = (state.auditAssignments || []).some(a => a.cycleId === c.id && a.status === 'confirmed');
  return hasCase || hasConfirmedAssign;
}
function buildCalendarCycleDrafts(year){
  const map = calendarMap();
  const cycles = [];
  let d = new Date(year, 0, 1);
  while(d.getDay() !== 1) d.setDate(d.getDate() + 1);
  while(d.getFullYear() === year){
    const openWeekStart = new Date(d);
    const openWeekEnd = new Date(d); openWeekEnd.setDate(openWeekStart.getDate() + 4);
    const improveWeekStart = new Date(d); improveWeekStart.setDate(openWeekStart.getDate() + 7);
    const improveWeekEnd = new Date(d); improveWeekEnd.setDate(openWeekStart.getDate() + 11);
    const openFirst = firstWorkdayBetween(openWeekStart, openWeekEnd, map);
    const openLast = lastWorkdayBetween(openWeekStart, openWeekEnd, map);
    const improveFirst = firstWorkdayBetween(improveWeekStart, improveWeekEnd, map);
    const improveLast = lastWorkdayBetween(improveWeekStart, improveWeekEnd, map);
    const warnings = [];
    if(!openFirst || !openLast) warnings.push('開單週無上班日，已略過');
    if(!improveFirst || !improveLast) warnings.push('改善週無上班日，已略過');
    if(openFirst && openLast && improveFirst && improveLast){
      if(dateKey(openFirst) !== dateKey(openWeekStart)) warnings.push(`開單起日順延至 ${dateKey(openFirst)}`);
      if(dateKey(openLast) !== dateKey(openWeekEnd)) warnings.push(`開單迄日調整至 ${dateKey(openLast)}`);
      if(dateKey(improveFirst) !== dateKey(improveWeekStart)) warnings.push(`改善起日順延至 ${dateKey(improveFirst)}`);
      if(dateKey(improveLast) !== dateKey(improveWeekEnd)) warnings.push(`改善迄日調整至 ${dateKey(improveLast)}`);
      const wNum = getWeekNum(openWeekStart);
      const cycleId = `${year}-W${String(wNum).padStart(2,'0')}`;
      const m = openWeekStart.getMonth() + 1;
      const quarter = m <= 3 ? `${year}-Q1` : m <= 6 ? `${year}-Q2` : m <= 9 ? `${year}-Q3` : `${year}-Q4`;
      const bounds = quarterBounds(quarter);
      const improveEnd = dateTimeValue(improveLast, '17:00');
      const verifyDate = calculateVerifyDateByCalendar(improveEnd, map);
      cycles.push({
        id: cycleId,
        quarter,
        openStart: dateTimeValue(openFirst, '08:00'),
        openEnd: dateTimeValue(openLast, '17:00'),
        improveStart: dateTimeValue(improveFirst, '08:00'),
        improveEnd,
        verifyDate,
        quarterStart: bounds.quarterStart,
        quarterEnd: bounds.quarterEnd,
        source: '公司行事曆匯入',
        status: '草稿',
        warnings
      });
    }
    d.setDate(d.getDate() + 14);
  }
  return cycles;
}

  if(!canEditMasters()){ toast('僅管理部可維護主檔'); return; }

function confirmCyclePreview(){
  if(!canEditMasters()){ toast('僅管理部可維護主檔'); return; }
  const preview = state.cycleImportPreview;
  if(!preview?.cycles?.length){ toast('目前沒有可寫入的週期草稿'); return; }
  if(!confirm(`確定將 ${preview.cycles.length} 筆週期草稿寫入週期主檔？已被案件或確認分配引用的週期會略過。`)) return;
  if(!state.cycles) state.cycles = [];
  let created = 0;
  let updated = 0;
  let skipped = 0;
  preview.cycles.forEach(nc => {
    const idx = state.cycles.findIndex(c => c.id === nc.id);
    const clean = {...nc};
    delete clean.warnings;
    clean.status = '已確認';
    if(idx >= 0){
      if(isCycleLocked(state.cycles[idx])){ skipped++; return; }
      state.cycles[idx] = clean;
      updated++;
    } else {
      state.cycles.push(clean);
      created++;
    }
  });
  state.cycles.sort((a,b) => a.id.localeCompare(b.id));
  state.cycleImportPreview = null;
  save();
  log(`主檔異動：公司行事曆寫入週期主檔，新增 ${created}、更新 ${updated}、略過 ${skipped}。`);
  toast(`週期主檔已更新：新增 ${created}、更新 ${updated}、略過 ${skipped}`);
  render();
}

  if(dt(improveEnd).getTime() < dt(improveStart).getTime()){ showErr('改善週迄日必須晚於或等於起日'); return; }

  if(!quarterStart || !quarterEnd){
    const bounds = quarterBounds(quarter);

    quarterEnd = bounds.quarterEnd;
  }
  if(errEl) errEl.style.display='none';

function batchGenerateCycles(){
  if(!canEditMasters()){ toast('僅管理部可維護主檔'); return; }
  const yearInput = document.getElementById('batchGenYear');
  if(!yearInput){ toast('無法讀取年份'); return; }
  const year = Number(yearInput.value);
  if(isNaN(year) || year < 2000 || year > 2100){ toast('請輸入有效的年份 (2000 ~ 2100)'); return; }
  
  if(!confirm(`確定要批次產生 ${year} 年度交替稽核週期（雙週交替，只在開單週開單）的資料嗎？\n這將會以預設排程生成整年週期（若代碼重複將自動覆蓋）。`)){ return; }
  
  const startJan1 = new Date(year, 0, 1);
  let d = new Date(startJan1);
  while(d.getDay() !== 1){
    d.setDate(d.getDate() + 1);
  }
  
  const newCycles = [];
  
  while(d.getFullYear() === year){
    const wNum = getWeekNum(d);
    const weekNumStr = String(wNum).padStart(2, '0');
    const cycleId = `${year}-W${weekNumStr}`;
    
    const openStart = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T08:00`;
    
    let fri = new Date(d);
    fri.setDate(d.getDate() + 4);
    const openEnd = `${fri.getFullYear()}-${String(fri.getMonth()+1).padStart(2,'0')}-${String(fri.getDate()).padStart(2,'0')}T17:00`;
    
    let nextMon = new Date(d);
    nextMon.setDate(d.getDate() + 7);
    const improveStart = `${nextMon.getFullYear()}-${String(nextMon.getMonth()+1).padStart(2,'0')}-${String(nextMon.getDate()).padStart(2,'0')}T08:00`;
    
    let nextFri = new Date(d);
    nextFri.setDate(d.getDate() + 11);
    const improveEnd = `${nextFri.getFullYear()}-${String(nextFri.getMonth()+1).padStart(2,'0')}-${String(nextFri.getDate()).padStart(2,'0')}T17:00`;
    
    const verifyDate = calculateVerifyDateByCalendar(improveEnd);
    
    const m = d.getMonth() + 1;
    let quarter = '';
    if(m <= 3) quarter = `${year}-Q1`;
    else if(m <= 6) quarter = `${year}-Q2`;
    else if(m <= 9) quarter = `${year}-Q3`;
    else quarter = `${year}-Q4`;
    
    const bounds = quarterBounds(quarter);
    const quarterStart = bounds.quarterStart;
    const quarterEnd = bounds.quarterEnd;
    
    newCycles.push({
      id: cycleId,
      openStart,
      openEnd,
      improveStart,
      improveEnd,
      verifyDate,
      quarter,
      quarterStart,
      quarterEnd,
      source: state.companyCalendar?.length ? '批次產生（公司行事曆）' : '批次產生',
      status: '已確認'
    });
    
    d.setDate(d.getDate() + 14);
  }
  
  if(!state.cycles) state.cycles = [];
  newCycles.forEach(nc => {
    const idx = state.cycles.findIndex(c => c.id === nc.id);
    if(idx !== -1){
      state.cycles[idx] = nc;
    } else {
      state.cycles.push(nc);
    }
  });
  
  state.cycles.sort((a,b) => a.id.localeCompare(b.id));
  
  log(`主檔異動：批次產生 ${year} 年度週期，共產生 ${newCycles.length} 週。`);
  save(); toast(`已成功產生/更新 ${year} 年度共 ${newCycles.length} 個週期資料！`); render();
}

function importCycles(e){
  const file = e.target.files[0];
  if(!file) return;
  
  const reader = new FileReader();
  const ext = file.name.split('.').pop().toLowerCase();
  
  reader.onload = function(evt) {
    const text = evt.target.result;
    let importedList = [];
    
    try {
      if(ext === 'json'){
        const json = JSON.parse(text);
        if(!Array.isArray(json)){
          throw new Error('JSON 格式必須是陣列');
        }
        json.forEach((item, idx) => {
          if(!item.id || !item.openStart || !item.openEnd || !item.improveStart || !item.improveEnd){
            throw new Error(`第 ${idx+1} 筆資料缺少必填欄位 (id, openStart, openEnd, improveStart, improveEnd)`);
          }
          const verifyDate = item.verifyDate || calculateVerifyDateByCalendar(item.improveEnd);
          const quarter = item.quarter || currentQuarter(item.openStart);
          const bounds = quarterBounds(quarter);
          importedList.push({
            id: String(item.id).trim(),
            quarter,
            openStart: String(item.openStart).trim(),
            openEnd: String(item.openEnd).trim(),
            improveStart: String(item.improveStart).trim(),
            improveEnd: String(item.improveEnd).trim(),
            verifyDate: String(verifyDate).trim(),
            quarterStart: String(item.quarterStart || bounds.quarterStart).trim(),
            quarterEnd: String(item.quarterEnd || bounds.quarterEnd).trim(),
            source: String(item.source || '日期主檔匯入').trim(),
            status: String(item.status || '已確認').trim(),
            remark: String(item.remark || '').trim()
          });
        });
      } else if(ext === 'csv'){
        const lines = text.split(/\r?\n/);
        if(lines.length === 0){
          throw new Error('CSV 檔案為空');
        }
        
        let startIdx = 0;
        const firstLine = lines[0].toLowerCase();
        if(firstLine.includes('週') || firstLine.includes('week') || firstLine.includes('id') || firstLine.includes('quarter')){
          startIdx = 1;
        }
        
        for(let i = startIdx; i < lines.length; i++){
          const line = lines[i].trim();
          if(!line) continue;
          
          const cells = line.split(',').map(c => c.trim().replace(/^"(.*)"$/, '$1'));
          if(cells.length < 5){
            throw new Error(`第 ${i+1} 行格式不符 (至少需要 5 個欄位：週代碼, 追蹤季度, 開單週起, 開單週迄, 改善週起, 改善週迄)`);
          }
          
          const id = cells[0];
          const quarter = cells[1] || currentQuarter(cells[2]);
          const openStart = cells[2];
          const openEnd = cells[3];
          const improveStart = cells[4];
          const improveEnd = cells[5];
          
          if(!id || !openStart || !openEnd || !improveStart || !improveEnd){
             throw new Error(`第 ${i+1} 行含有空白欄位`);
          }
          
          const verifyDate = cells[6] || calculateVerifyDateByCalendar(improveEnd);
          const bounds = quarterBounds(quarter);
          const quarterStart = cells[7] || bounds.quarterStart;
          const quarterEnd = cells[8] || bounds.quarterEnd;
          
          importedList.push({
            id, quarter, openStart, openEnd, improveStart, improveEnd, verifyDate, quarterStart, quarterEnd,
            source: '日期主檔匯入',
            status: '已確認',
            remark: ''
          });
        }
      } else {
        throw new Error('不支援的檔案格式，請匯入 .json 或 .csv 檔案');
      }
      
      if(importedList.length === 0){
        throw new Error('未能成功解析任何週期資料');
      }
      
      if(!state.cycles) state.cycles = [];
      importedList.forEach(nc => {
        const idx = state.cycles.findIndex(c => c.id === nc.id);
        if(idx !== -1){
          state.cycles[idx] = nc;
        } else {
          state.cycles.push(nc);
        }
      });
      
      state.cycles.sort((a,b) => a.id.localeCompare(b.id));
      
      log(`主檔異動：匯入日期主檔，成功新增/覆寫 ${importedList.length} 筆週期設定。`);
      save(); toast(`成功匯入 ${importedList.length} 筆週期資料！`); render();
      
    } catch(err) {
      alert(`匯入失敗：${err.message}`);
      log(`主檔匯入失敗：${err.message}`);
    } finally {
      e.target.value = '';
    }
  };
  
  reader.readAsText(file);
}

    errEl.style.display='block'; errEl.textContent='此組別代碼已存在'; return;
  }
  
  if(isEdit){
    state.auditTeams[idx].name = name;
    state.auditTeams[idx].members = selectedMembers;
  } else {
    state.auditTeams.push({ id, name, members: selectedMembers });
  }
  
  save(); closeModal(); toast('組別設定已儲存'); render();
}

function generateAssignmentForCycle(cycleId) {
  const teams = state.auditTeams;
  const areas = getActiveAuditAreas().map(a => a.name);
  if(teams.length === 0 || areas.length === 0) return null;

  const sortedCycles = [...state.cycles].sort((a,b) => a.id.localeCompare(b.id));
  const currentIdx = sortedCycles.findIndex(c => c.id === cycleId);
  let prevCycleId = null;
  if(currentIdx > 0){
    prevCycleId = sortedCycles[currentIdx - 1].id;
  }
  const prevAssign = prevCycleId ? state.auditAssignments.find(a => a.cycleId === prevCycleId) : null;

  let bestAssignment = null;
  let minOverlap = Infinity;

  for(let attempt = 0; attempt < 20; attempt++) {
    const shuffledAreas = [...areas].sort(() => Math.random() - 0.5);
    const candidate = [];
    const areasPerTeam = Math.ceil(shuffledAreas.length / teams.length);
    
    for(let i = 0; i < teams.length; i++) {
      const start = i * areasPerTeam;
      const teamAreas = shuffledAreas.slice(start, start + areasPerTeam);
      candidate.push({ teamId: teams[i].id, areas: teamAreas });
    }

    if(!prevAssign) {
      bestAssignment = candidate;
      break; 
    }

    let overlapCount = 0;
    candidate.forEach(ta => {
      const prevTa = prevAssign.assignments.find(pa => pa.teamId === ta.teamId);
      if(prevTa){
        ta.areas.forEach(a => {
          if(prevTa.areas.includes(a)) overlapCount++;
        });
      }
    });

    if(overlapCount < minOverlap) {
      minOverlap = overlapCount;
      bestAssignment = candidate;
    }
    if(minOverlap === 0) break;
  }

  return {
    cycleId,
    status: 'draft',
    assignments: bestAssignment
  };
}

function openAssignmentModal(cycleId){
  const cycle = state.cycles.find(c => c.id === cycleId);
  if(!cycle) return;
  
  let assign = state.auditAssignments.find(a => a.cycleId === cycleId);
  const areas = getActiveAuditAreas();
  const editBtn = canEditMasters();

  if(!assign){
    assign = {
      cycleId: cycleId,
      status: 'draft',
      assignments: state.auditTeams.map(t => ({ teamId: t.id, areas: [] }))
    };
  }

  let bodyHtml = `
    <div style="margin-bottom:14px; font-size:14px; line-height:1.6;">
      <b>週期代碼：</b>${cycle.id} <br>
      <b>開單週時間：</b>${fmt(cycle.openStart)} ~ ${fmt(cycle.openEnd)}
    </div>
    <div class="divider"></div>
    <div style="font-weight:bold;margin-bottom:12px;font-size:14px;">組別區域指派：</div>
  `;

  assign.assignments.forEach((ta, tIdx) => {
    const team = state.auditTeams.find(t => t.id === ta.teamId);
    const tName = team ? team.name : ta.teamId;
    const membersStr = team && team.members.length ? ` (${team.members.join(', ')})` : '';
    
    const areaCheckboxes = areas.map(ar => {
      const isChecked = ta.areas.includes(ar.name);
      return `
        <label style="display:inline-flex;align-items:center;margin-right:12px;cursor:pointer;font-size:13px;margin-bottom:6px;">
          <input type="checkbox" class="assign-area-checkbox" data-team-id="${ta.teamId}" value="${ar.name}" ${isChecked ? 'checked' : ''} ${!editBtn ? 'disabled' : ''} style="width:15px;height:15px;margin-right:4px;">
          ${ar.name}
        </label>
      `;
    }).join('');

    bodyHtml += `
      <div style="margin-bottom:16px;background:#f8fafc;padding:12px;border:1px solid var(--border);border-radius:6px;">
        <div style="font-weight:700;color:var(--blue);margin-bottom:8px;">${tName}${membersStr}</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;">
          ${areaCheckboxes}
        </div>
      </div>
    `;
  });

  bodyHtml += `
    <div id="assignFormError" class="badBox" style="display:none;margin-top:12px"></div>
  `;

  let footerHtml = '';
  if(editBtn){
    footerHtml = `
      <button class="btn btnPurple" data-action="genSingleRandomAssignment" data-cycle-id="${cycleId}">🎲 隨機產生</button>
      <button class="btn btnPrimary" data-action="saveAssignmentModal" data-cycle-id="${cycleId}" data-status="confirmed">儲存並確認生效</button>
      <button class="btn btnLight" data-action="saveAssignmentModal" data-cycle-id="${cycleId}" data-status="draft">儲存草稿</button>
      <button class="btn btnLight" data-action="closeModal">取消</button>
    `;
  } else {
    footerHtml = `<button class="btn btnLight" data-action="closeModal">關閉</button>`;
  }

  openModal(`分配稽核區域｜${cycleId}`, bodyHtml, footerHtml);
}

function saveAssignmentModal(cycleId, status) {
  if(!canEditMasters()){ toast('僅管理部可維護主檔'); return; }
  
  const checkboxes = document.querySelectorAll('.assign-area-checkbox');
  const assignmentMap = {};
  
  state.auditTeams.forEach(t => {
    assignmentMap[t.id] = [];
  });
  
  checkboxes.forEach(cb => {
    if(cb.checked){
      const teamId = cb.dataset.teamId;
      const area = cb.value;
      if(assignmentMap[teamId]){
        assignmentMap[teamId].push(area);
      }
    }
  });

  const teamAssignments = [];
  for(const teamId in assignmentMap){
    teamAssignments.push({ teamId, areas: assignmentMap[teamId] });
  }

  let assignIdx = state.auditAssignments.findIndex(a => a.cycleId === cycleId);
  const newAssign = {
    cycleId,
    status,
    confirmedBy: status === 'confirmed' ? state.userName : '',
    confirmedAt: status === 'confirmed' ? now() : '',
    assignments: teamAssignments
  };

  if(assignIdx > -1){
    state.auditAssignments[assignIdx] = newAssign;
  } else {
    state.auditAssignments.push(newAssign);
  }

  save();
  closeModal();
  toast(status === 'confirmed' ? '區域分配已確認生效' : '已儲存分配草稿');
  render();
}

function genSingleRandomAssignment(cycleId) {
  const newAssign = generateAssignmentForCycle(cycleId);
  if(!newAssign) {
    toast('隨機產生失敗，請確認是否已有設定組別及稽核區域。');
    return;
  }

  const checkboxes = document.querySelectorAll('.assign-area-checkbox');
  checkboxes.forEach(cb => {
    const teamId = cb.dataset.teamId;
    const area = cb.value;
    const teamAssign = newAssign.assignments.find(a => a.teamId === teamId);
    cb.checked = teamAssign ? teamAssign.areas.includes(area) : false;
  });

  toast('已填入隨機分配（草稿，請點儲存）');
}

function batchGenAssignments() {
  if(!canEditMasters()){ toast('僅管理部可維護主檔'); return; }
  if(!confirm('這將會為所有尚未確認的開單週重新產生隨機區域分配並確認生效。是否繼續？')) return;

  let count = 0;
  state.cycles.forEach(c => {
    const existing = state.auditAssignments.find(a => a.cycleId === c.id);
    if(!existing || existing.status !== 'confirmed') {
      const newAssign = generateAssignmentForCycle(c.id);
      if(newAssign) {
        newAssign.status = 'confirmed';
        newAssign.confirmedBy = state.userName;
        newAssign.confirmedAt = now();
        
        let assignIdx = state.auditAssignments.findIndex(a => a.cycleId === c.id);
        if(assignIdx > -1){
          state.auditAssignments[assignIdx] = newAssign;
        } else {
          state.auditAssignments.push(newAssign);
        }
        count++;
      }
    }
  });

  if(count > 0) {
    save();
    toast(`已批次產生並確認 ${count} 週分配資料`);
    render();
  } else {
    toast('所有週別的區域分配均已確認，無需重新產生。');
  }
}
